services:
  smokeping:
    image: linuxserver/smokeping@sha256:6861c15df8151c454ed09da610b64c86bc274748e664f53f3e15ec1a3cd45431
    container_name: smokeping
    environment:
      - PUID=1001
      - PGID=1001
      - TZ=UTC
    volumes:
      - ./smokeping/config:/config
      - ./smokeping/data:/data
      - ./smokeping/etc/config:/etc/smokeping/config
      - ./smokeping/etc/ssmtp.conf:/etc/ssmtp/ssmtp.conf
    ports:
      - 8099:80
    mem_limit: 4096m
    restart: unless-stopped